<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>smoke</title></head>
<body>
<div id="wrap"><canvas id="game" width="960" height="540"></canvas><input id="nameInput" maxlength="12" style="display:none"></div>
<script>
  window.__errors = [];
  window.onerror = (msg, src, line) => { window.__errors.push(msg + ' @ ' + (src||'').split('/').pop() + ':' + line); };
</script>
<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/data.js"></script>
<script src="js/fx.js"></script>
<script src="js/input.js"></script>
<script src="js/net.js"></script>
<script src="js/replay.js"></script>
<script src="js/spec.js"></script>
<script src="js/weather.js"></script>
<script src="js/player.js"></script>
<script src="js/combat.js"></script>
<script src="js/ai.js"></script>
<script src="js/flow.js"></script>
<script src="js/update.js"></script>
<script src="js/render.js"></script>
<script src="js/escena.js"></script>
<script src="js/ui.js"></script>
<script src="js/bonus.js"></script>
<script src="js/main.js"></script>
<script>
  // driver determinista: avanza la simulación a mano, sin rAF
  const seen = ['title'];
  function tick(n) {
    for (let i = 0; i < n; i++) {
      handleMenus();
      update(1 / 60);
      keyPressQueue.length = 0;
      tapQueue.length = 0;
      if (seen[seen.length - 1] !== scene) seen.push(scene);
    }
  }
  function press(code) { keyPressQueue.push(code); }

  try {
    press('Enter'); tick(2);    // título → torneo → choose
    press('KeyD');  tick(2);    // navegar personajes
    press('KeyS');  tick(2);
    press('Enter'); tick(2);    // confirmar guerrero → virtud
    press('KeyD');  tick(2);
    press('Enter'); tick(2);    // confirmar don → vs
    press('Enter'); tick(2);    // saltar presentación → destino
    tick(60 * 12);              // destino + apuesta + inicio de ronda + pelea
    draw(1);                    // una pasada de dibujo de la pelea
    scene = 'choose'; draw(2);  // y de cada pantalla nueva
    scene = 'vs'; draw(3);
    scene = 'apuesta'; draw(4);

    // modo 2 jugadores: J1 elige, J2 elige, presentación y pelea
    start2P(); tick(1);
    press('KeyD');  tick(2);
    press('Enter'); tick(2);    // J1 elige
    press('KeyS');  tick(2);
    press('KeyK');  tick(2);    // J2 elige con K
    tick(60 * 12);              // vs (auto) + destino + apuesta + pelea
    window.__2p = { escena: scene, j1: playerChar.name, j2: rivalChar.name,
                    v1: p1 && p1.virtud && p1.virtud.name, v2: p2 && p2.virtud && p2.virtud.name };

    // determinismo: misma semilla + mismos inputs ⇒ misma pelea
    function simHash(seed) {
      seedRng(seed);
      const orig = readInput;
      let tk = 0;
      readInput = (p, isP1) => {
        const fase = (tk >> 5) % 4;
        // finta sostenida + flancos de salto/abajo: ejercita el cambio de
        // kamae (v2) además de cortes, fintas, saltos y guardias
        return isP1
          ? { left: fase === 1, right: fase === 0, jump: tk % 60 === 7 || tk % 97 === 11,
              attack: tk % 53 === 17, feint: tk % 60 < 10, down: tk % 60 === 4, guard: false }
          : { left: fase === 0, right: fase === 2, jump: tk % 74 === 9 || tk % 89 === 7,
              attack: tk % 47 === 13, feint: tk % 74 < 12, down: tk % 74 === 5, guard: false };
      };
      vsCPU = false; run = null; runVirtud = null; modoFinal = false;
      playerChar = CHARS[0]; rivalChar = CHARS[2];
      startMatch();
      let h = 0;
      window.__kamaes = new Set();
      for (tk = 0; tk < 60 * 25; tk++) {
        update(1 / 60);
        __kamaes.add(p1.kamae); __kamaes.add(p2.kamae);
        if (tk % 7 === 0) {
          const s = [p1.x, p1.y, p1.vida, p1.postura, p1.state, p1.kamae, p1.sheathed, p1.iai,
                     p2.x, p2.y, p2.vida, p2.postura, p2.state, p2.kamae, p2.sheathed, p2.iai,
                     roundNum, scene, destino.id, stage.id].join(',');
          for (let i = 0; i < s.length; i++) h = (Math.imul(h, 31) + s.charCodeAt(i)) >>> 0;
        }
      }
      readInput = orig;
      return h;
    }
    const hA = simHash(12345), hB = simHash(12345), hC = simHash(99999);
    window.__det = { iguales: hA === hB, distintas: hA !== hC, hash: hA,
                     kamaesUsadas: Array.from(window.__kamaes).sort() };
  } catch (e) { window.__errors.push('driver: ' + e.message); }

  // ---- desafío diario (3.1): plan reproducible e independiente del clima ----
  try {
    // el plan se pre-genera de la semilla: misma semilla → mismo torneo
    const planA = JSON.stringify(buildDailyPlan(20260703));
    const planB = JSON.stringify(buildDailyPlan(20260703));
    const planC = JSON.stringify(buildDailyPlan(19990101));
    // recorrido del modo diario con un clima real FORZADO (debe ignorarse)
    clima = { destinoId: 'sangre', label: 'forzado' };
    startRun(false, true);
    const planCompleto = !!dailyPlan && dailyPlan.fights.length === RUN_FIGHTS;
    press('Enter'); tick(2);      // elige guerrero (pool[0])
    press('Enter'); tick(2);      // elige el don (del plan)
    tick(60 * 9);                 // vs + destino + apuesta + inicio de ronda
    const fp0 = dailyPlan.fights[0];
    window.__diario = {
      planDeterminista: planA === planB,
      planVariaPorFecha: planA !== planC,
      planCompleto,
      jefeSecreto: !!(run && run.boss && run.boss.secret),
      escenaLlego: scene,
      destinoIgnoraClima: !!(destino && destino.id === fp0.destinoId),
      escenarioDelPlan: !!(stage && stage.id === fp0.stageId),
      apuestaDelPlan: !!(p1 && betSel && betSel[0] === fp0.bets[0][0] && betSel[1] === fp0.bets[0][1]),
      esDiario: dailyRun,
    };
    dailyRun = false; dailyPlan = null;   // no contaminar el resto
  } catch (e) { window.__errors.push('diario: ' + e.message); }

  // ---- gestas (3.3): evaluación en punto único + elegir sellos (máx 3) ----
  try {
    save.gestas = []; save.sellos = []; gestasNuevas = [];
    // un contexto que dispara varias gestas de duelo y de torneo
    evaluarGestas({ won: true, stats: { feints: 0, taken: 0, parries: 3, iaiHits: 1 },
                    foeWins: 0, foeAtMatchPoint: false, execution: true, destino: 'sangre',
                    champion: true, charId: 'nino', roundsLost: 0 });
    const desbloq = save.gestas.slice();
    // elegir 4 sellos: el 4º debe expulsar al 1º (tope 3)
    for (const id of ['honesta', 'intacta', 'campeon', 'carmesi']) {
      gestaSel = GESTAS.findIndex(g => g.id === id); gestaToggle();
    }
    // volver a tocar 'carmesi' lo quita
    window.__gestas = {
      total: GESTAS.length,
      desbloqueadas: desbloq.length,
      nino: desbloq.includes('nino'), campeon: desbloq.includes('campeon'),
      noCenizas: !desbloq.includes('cenizas'), noCosecha: !desbloq.includes('cosecha'),
      sellos: save.sellos.slice(), tope3: save.sellos.length <= 3,
      selloStr: sellosStr(save.sellos), avisos: gestasNuevas.length,
    };
  } catch (e) { window.__errors.push('gestas: ' + e.message); }

  const pre = document.createElement('pre');
  pre.id = 'result';
  pre.textContent = JSON.stringify({
    escenas: seen,
    escenaFinal: scene,
    guerrero: playerChar && playerChar.name,
    rival: rivalChar && rivalChar.name,
    don: runVirtud && runVirtud.name,
    apuestas: betSel,
    p1bet: p1 && p1.bet, p2bet: p2 && p2.bet,
    p1virtud: p1 && p1.virtud && p1.virtud.name,
    dosJugadores: window.__2p,
    determinismo: window.__det,
    diario: window.__diario,
    gestas: window.__gestas,
    errores: window.__errors,
  }, null, 1);
  document.body.appendChild(pre);
</script>
</body>
</html>
